services:

  # ── PHP + Nginx (Laravel) ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    env_file:
      - .env
    volumes:
      # Hot-reload del código en local (sin reconstruir imagen)
      - .:/var/www/html
      # vendor/ usa el instalado en la imagen (Linux), no el del host (Windows)
      - vendor_data:/var/www/html/vendor
      # Persistir logs y cache de sesiones
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-prueba_tecnica}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-prueba_tecnica}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  storage_data:
  vendor_data:
